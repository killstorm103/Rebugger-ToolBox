<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rebugger ToolBox Update Checker (PS3)</title>
<style>
  body { font-family: Arial; color: white; background: #000; padding:14px; }
  .ok { color:#00ff00; }
  .warn { color:#ffaa00; }
  .err { color:#ff4444; }
  pre { background:#111; padding:8px; white-space:pre-wrap; }
</style>
</head>
<body>

<h2>Rebugger ToolBox — Update Checker</h2>
<button onclick="check()">Check Version</button>
<div id="out" style="margin-top:12px"></div>

<script>
const REMOTE_URL =
  "https://raw.githubusercontent.com/killstorm103/Rebugger-ToolBox/dev/xml/settings/version.txt";

// webMAN paths (try port 80 then 81)
const LOCAL_URLS = [
  "http://127.0.0.1/dev_hdd0/game/Rebugger_Tool/USRDIR/xml/settings/version.txt",
  "http://127.0.0.1:81/dev_hdd0/game/Rebugger_Tool/USRDIR/xml/settings/version.txt"
];

function out(html, cls){
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.innerHTML = html;
  document.getElementById("out").appendChild(d);
}

function clearOut(){
  document.getElementById("out").innerHTML = "";
}

function xhrGet(url, cb){
  const x = new XMLHttpRequest();
  x.open("GET", url, true);
  x.onreadystatechange = function(){
    if (x.readyState === 4) {
      if (x.status === 200) cb(null, x.responseText);
      else cb("HTTP " + x.status);
    }
  };
  try { x.send(); } catch(e){ cb(e); }
}

function parse(txt){
  return {
    version: (txt.match(/Version:\s*([0-9.]+)/i)||[])[1],
    dev:     (txt.match(/is\s*Dev\s*Build:\s*(true|false)/i)||[])[1],
    devNum:  (txt.match(/Dev.*Number:\s*#?(\d+)/i)||[])[1],
    raw: txt
  };
}

function cmp(a,b){
  a=a.split('.'); b=b.split('.');
  for(let i=0;i<3;i++){
    let x=parseInt(a[i]||0), y=parseInt(b[i]||0);
    if(x>y) return 1;
    if(x<y) return -1;
  }
  return 0;
}

function loadLocal(i, cb){
  if (i >= LOCAL_URLS.length) return cb("No local URL worked");
  out("Trying local: " + LOCAL_URLS[i]);
  xhrGet(LOCAL_URLS[i], function(err, txt){
    if (!err) cb(null, txt);
    else loadLocal(i+1, cb);
  });
}

function check(){
  clearOut();
  out("Checking local version…");

  loadLocal(0, function(err, localTxt){
    if (err) {
      out("Cannot read local version via webMAN.", "err");
      return;
    }

    const L = parse(localTxt);
    out("<h3>Local</h3><pre>"+localTxt+"</pre>");

    out("Fetching remote version…");
    xhrGet(REMOTE_URL, function(err2, remoteTxt){
      if (err2) {
        out("Cannot fetch remote version.", "err");
        return;
      }

      const R = parse(remoteTxt);
      out("<h3>Remote</h3><pre>"+remoteTxt+"</pre>");

      if (!L.version || !R.version) {
        out("Failed to parse version.txt", "err");
        return;
      }

      const c = cmp(R.version, L.version);
      if (c > 0)
        out("Update available!", "warn");
      else
        out("You are up to date.", "ok");
    });
  });
}
</script>
</body>
</html>
