<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rebugger ToolBox Update Checker</title>
<style>
body { font-family: Arial; color: white; background: black; }
.ok { color: #00ff00; }
.warn { color: #ffaa00; }
.err { color: #ff4444; }
pre { background:#111; padding:8px; }
</style>
</head>
<body>

<h2>Rebugger ToolBox Update Checker</h2>
<button onclick="checkUpdate()">Check Version</button>

<div id="out"></div>

<script>
var REMOTE_URL = "https://raw.githubusercontent.com/killstorm103/Rebugger-ToolBox/dev/xml/settings/version.txt";
var LOCAL_URL  = "/dev_hdd0/game/Rebugger_Tool/USRDIR/xml/settings/version.txt";

function loadText(url, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200 || xhr.status === 0) {
        cb(null, xhr.responseText);
      } else {
        cb("Failed to load: " + url);
      }
    }
  };
  xhr.send(null);
}

function parseVersion(txt) {
  return {
    version: (txt.match(/Version:\s*([0-9.]+)/i)||[])[1],
    dev: (txt.match(/is Dev Build:\s*(true|false)/i)||[])[1],
    devNum: (txt.match(/Dev.*Number:\s*#?(\d+)/i)||[])[1]
  };
}

function cmp(a,b){
  a=a.split('.'); b=b.split('.');
  for(var i=0;i<3;i++){
    var x=parseInt(a[i]||0), y=parseInt(b[i]||0);
    if(x>y) return 1;
    if(x<y) return -1;
  }
  return 0;
}

function checkUpdate() {
  var out = document.getElementById("out");
  out.innerHTML = "Checking…";

  loadText(LOCAL_URL, function(err, localTxt){
    if(err){ out.innerHTML="<div class='err'>Cannot read local version.txt</div>"; return; }

    loadText(REMOTE_URL, function(err2, remoteTxt){
      if(err2){ out.innerHTML="<div class='err'>Cannot read remote version.txt</div>"; return; }

      var L = parseVersion(localTxt);
      var R = parseVersion(remoteTxt);

      var html = "<h3>Local</h3><pre>"+localTxt+"</pre>";
      html += "<h3>Remote</h3><pre>"+remoteTxt+"</pre>";

      if(cmp(R.version, L.version) > 0)
        html += "<div class='warn'>Update available</div>";
      else
        html += "<div class='ok'>You are up to date</div>";

      out.innerHTML = html;
    });
  });
}
</script>

</body>
</html>
