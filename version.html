  <script>
    // Simple semver-ish comparator. Works with numeric versions like 1.2.3, 1.2, 2, or strings like "2025-02-01"
    function normalizeParts(v){
      // Split on non-digit chars but keep numeric segments; fallback to whole string
      const parts = (v||"").trim().split(/[^0-9]+/).filter(Boolean).map(n=>parseInt(n,10));
      if(parts.length===0) return [v||""];
      return parts;
    }

    function compareVersions(a,b){
      // returns 1 if a>b, 0 if equal, -1 if a<b
      const pa = normalizeParts(a);
      const pb = normalizeParts(b);
      // if parts are arrays of numbers, compare numeric
      const numericA = pa.every(x=>typeof x==='number' && !Number.isNaN(x));
      const numericB = pb.every(x=>typeof x==='number' && !Number.isNaN(x));
      if(numericA && numericB){
        const L = Math.max(pa.length,pb.length);
        for(let i=0;i<L;i++){
          const na = pa[i]||0;
          const nb = pb[i]||0;
          if(na>nb) return 1;
          if(na<nb) return -1;
        }
        return 0;
      }
      // Fallback to trimmed string compare
      const sa = (a||"").trim();
      const sb = (b||"").trim();
      if(sa===sb) return 0;
      return sa>sb?1:-1;
    }
