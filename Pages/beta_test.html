<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Version Checker</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 20px; }
        #status { margin-top: 30px; }
    </style>
</head>
<body>
    <h2>Checking Toolbox Version...</h2>
    <div id="status"></div>

    <script>
        // ----- CONFIGURATION -----
        var LOCAL_VERSION_PATH = 'http://127.0.0.1/dev_hdd0/game/Rebugger_Tool/USRDIR/version.txt';
        var REMOTE_VERSION_URL = 'http://raw.githubusercontent.com/killstorm103/Rebugger-ToolBox/main/version.txt';
        var DOWNLOAD_PAGE_URL = 'http://raw.githack.com/killstorm103/Rebugger-ToolBox/dev/Pages/Download_Page.html';

        // ----- HELPER: Parse version.txt (same format as before) -----
        function parseVersionFile(text) {
            var data = { version: null, devBuild: 0 };
            var lines = text.split('\n');
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                var stableMatch = line.match(/^version:\s*([\d.]+)$/i);
                if (stableMatch) { data.version = stableMatch[1]; data.devBuild = 0; continue; }
                var devVersionMatch = line.match(/^version\s+([\d.]+)$/i);
                if (devVersionMatch) { data.version = devVersionMatch[1]; continue; }
                var devBuildMatch = line.match(/^dev\s+build:\s*(\d+)$/i);
                if (devBuildMatch) { data.devBuild = parseInt(devBuildMatch[1], 10); }
            }
            return data;
        }

        function compareVersions(v1, v2) {
            var p1 = v1.split('.'), p2 = v2.split('.');
            for (var i = 0; i < Math.max(p1.length, p2.length); i++) {
                var n1 = parseInt(p1[i] || '0', 10), n2 = parseInt(p2[i] || '0', 10);
                if (n1 > n2) return 1;
                if (n1 < n2) return -1;
            }
            return 0;
        }

        function isUpdateAvailable(local, remote) {
            if (!remote.version) return false;
            var cmp = compareVersions(remote.version, local.version);
            if (cmp > 0) return true;
            if (cmp < 0) return false;
            // Same version: if remote is dev and local is not, or remote dev build is higher
            if (remote.devBuild > 0) {
                if (local.devBuild === 0) return true;
                return remote.devBuild > local.devBuild;
            }
            return false;
        }

        // ----- Fetch a URL and return text (PS3 compatible) -----
        function fetchText(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) callback(xhr.responseText);
                    else callback(null);
                }
            };
            xhr.open('GET', url, true);
            xhr.send();
        }

        // ----- Main update check -----
        function checkUpdates() {
            var statusEl = document.getElementById('status');
            statusEl.innerHTML = 'Fetching local version...';

            // 1. Fetch local version.txt via webMAN
            fetchText(LOCAL_VERSION_PATH, function(localText) {
                if (!localText) {
                    statusEl.innerHTML = 'Error: Could not read local version.txt.';
                    return;
                }
                var localVer = parseVersionFile(localText);
                if (!localVer.version) {
                    statusEl.innerHTML = 'Error: Invalid local version format.';
                    return;
                }

                statusEl.innerHTML = 'Fetching remote version...';

                // 2. Fetch remote version.txt
                fetchText(REMOTE_VERSION_URL, function(remoteText) {
                    if (!remoteText) {
                        statusEl.innerHTML = 'Error: Could not contact update server.';
                        return;
                    }
                    var remoteVer = parseVersionFile(remoteText);
                    if (!remoteVer.version) {
                        statusEl.innerHTML = 'Error: Invalid remote version format.';
                        return;
                    }

                    // 3. Compare and display result
                    if (isUpdateAvailable(localVer, remoteVer)) {
                        statusEl.innerHTML = '<p style="color:#ffa500;">A new version is available!</p>' +
                            '<p>Local:  ' + localVer.version + (localVer.devBuild > 0 ? ' (Dev ' + localVer.devBuild + ')' : '') + '<br>' +
                            'Remote: ' + remoteVer.version + (remoteVer.devBuild > 0 ? ' (Dev ' + remoteVer.devBuild + ')' : '') + '</p>' +
                            '<p><a href="' + DOWNLOAD_PAGE_URL + '" style="color:#fff;">Go to Download Page</a></p>';
                    } else {
                        statusEl.innerHTML = 'Your Toolbox is up to date.';
                    }
                });
            });
        }

        window.onload = checkUpdates;
    </script>
</body>
</html>
