<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebugger - ToolBox</title>
    <script src="https://raw.githubusercontent.com/killstorm103/Rebugger-ToolBox/dev/Scripts/Platform_Checker.js"></script>
</head>
<body>
<style>
    #marginInput {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 4px;
        font-size: 14px;
    }
    #applyMarginBtn {
        font-weight: bold;
    }
    #applyMarginBtn:hover {
        background: #b02a37;
    }
    .image-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .image-gallery img {
        border-radius: 8px;
        box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #000000;
    }
    .container {
        max-width: max-content;
        padding: 20px 20px 10px 20px;
        margin-top: 160px;
    }
    .fixed-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: #000000;
        padding: 10px 20px;
        z-index: 1000;
        border-bottom: 1px solid #333;
    }
    .nav-container {
        margin-top: 10px;
    }
    h1 {
        text-align: left;
        font-size: 40px;
        margin: 0;
        color: #ffffff;
    }
    h1_under {
        text-align: left;
        font-size: 14px;
        margin: 0;
        color: #ffffff;
    }
    .main {
        list-style-type: none;
        padding: 0;
    }
    .main li {
        background-color: #fff;
        padding: 10px;
        margin-bottom: 20px;
        border: .5px solid rgba(0,0,0,0.1);
        border-radius: 7px;
        box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        font-size: 17px;
        margin-top: 8px;
        margin-bottom: 8px;
    }
    .main h2 {
        margin-top: 0;
        margin-bottom: 10px;
        color: #000000;
    }
    .main ul {
        list-style-type: disc;
        margin-left: 20px;
        margin-right: 30px;
    }
    .main ul li {
        margin-bottom: 5px;
    }
    .space {
        display: block;
        margin: 0 0 0 20px;
    }
    .space2 {
        display: block;
        margin: 0 0 0 34px;
    }
    .size {
        font-size: 16px;
    }
    .nav-button {
        display: inline-block;
        padding: 10px 20px;
        margin: 10px 0;
        background-color: #dc3545;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 16px;
        border: none;
        transition: background-color 0.2s;
    }
    .nav-button:hover {
        background-color: #b02a37;
        cursor: pointer;
    }

    /* spanned – used inside dark boxes */
    .spanned {
        display: block;
        color: #f79452;
    }
</style>

<div class="fixed-header">
    <h1>Dillans Platform Debugger</h1>
    <div class="nav-container"></div>
</div>

<div id="mainContainer" class="container">
    <ul class="main">
        <li class="bloc">
            <h2>Platform Debugger<span class="size"></span></h2>
            <ul>
                <li style="padding:0; margin:0;">
                    <div style="background:#222; border-left:5px solid #dc3545; padding:15px; color:#fff; margin-bottom:0px;">
                        <strong>Information</strong><br>
                        <span class="spanned" style="margin-top: 10px">└ Is PS3: <span id="isPs3Span">Checking...</span></span><br>
                        <span class="spanned" style="margin-top: 10px">└ PS3 Silk Browser Engine: <span id="EngineSpan">Checking...</span></span><br>
                        <span class="spanned" style="margin-top: 10px">└ Firmware Version: <span id="fwSpan">Checking...</span></span><br>
                        <span class="spanned" style="margin-top: 10px">└ User Agent: <span id="uaSpan"></span></span><br>
                        <span class="spanned" style="margin-top: 10px">└ Plugins:</span><br>
                        <span id="pluginsSpan" style="display:block; margin-left:20px; color:#f79452;"></span>
                    </div>
                </li>
            </ul>
            <script>
                function updateStatus() {
                    var isPs3Elem = document.getElementById('isPs3Span'),
                        fwElem     = document.getElementById('fwSpan'),
                        uaElem     = document.getElementById('uaSpan'),
                        engineElem = document.getElementById('EngineSpan'),
                        PluginElem = document.getElementById('pluginsSpan');

                    // Is PS3?
                    if (window.isPS3) {
                        isPs3Elem.innerHTML = '✔️ Yes';
                    } else {
                        isPs3Elem.innerHTML = '❌ No (standard browser)';
                    }

                    // Firmware
                    fwElem.innerHTML = window.isPS3 ? (window.ps3Firmware || 'Unknown') : 'N/A';

                    // Silk Engine?
                    if (window.isPS3SilkBrowserEngine) {
                        engineElem.innerHTML = '✔️ Yes';
                    } else {
                        engineElem.innerHTML = '❌ No';
                    }

                    // User Agent
                    uaElem.innerHTML = window.UserAgent || navigator.userAgent;

                    // Plugins – full details loop (as you wanted)
                    var pluginList = '';
                    if (navigator.plugins && navigator.plugins.length > 0) 
                    {
                        for (var i = 0; i < navigator.plugins.length; i++) {
                            var p = navigator.plugins[i];
 
                            pluginList += 'Name: ' + (p.name        || '(unnamed)') + ' (Plugin #' + (i + 1) + ')' + '<br>';
                            pluginList += 'File: ' + (p.filename    || '(no filename)') + '<br>';
                            pluginList += 'Description: ' + (p.description || '(no description)') + '<br>';

                            // Try to extract version
                            var ver = p.version || '';
                            if (ver === '' && p.description) {
                                var match = p.description.match(/(\d+\.\d+[^\s]*)/);
                                if (match) ver = match[1];
                            }
                            pluginList += 'Version: ' + (ver || '(not reported)') + '<br>';

                            // MIME types
                            pluginList += 'MIME types (' + p.length + '):<br>';
                            if (p.length > 0) {
                                for (var j = 0; j < p.length; j++) {
                                    var mime = p[j];
                                    if (mime) {
                                        pluginList += '&nbsp;&nbsp;' + (j + 1) + '. ' + (mime.type || '?') +
                                                      ' (' + (mime.suffixes || 'none') + ')<br>';
                                    }
                                }
                            } else {
                                pluginList += '&nbsp;&nbsp;(none)<br>';
                            }
                            pluginList += '<br>'; // space between plugins
                        }
                    } else {
                        pluginList = 'No plugins available or not supported';
                    }
                    PluginElem.innerHTML = pluginList;
                }

                if (document.readyState === 'complete') {
                    updateStatus();
                } else {
                    window.onload = updateStatus;
                }
            </script>
        </li>
    </ul>
</div>
<script src="https://cdn.jsdelivr.net/gh/killstorm103/Rebugger-ToolBox@dev/Scripts/Auto_Buttons.js"></script>
</body>
</html>
